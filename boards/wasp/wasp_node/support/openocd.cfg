# wasp node board — OpenOCD configuration for a bare ST-Link V2 on J6 (TC2030)
#
# Copyright (c) 2026 Oskar von Heideken
# SPDX-License-Identifier: Apache-2.0
#
# Deliberately NOT a copy of the Nucleo-H723ZG config: that one sources
# interface/stlink-dap.cfg, which is the ST-Link *V3* path. interface/stlink.cfg
# drives the same st-link adapter driver and supports dapdirect on a V2 with
# firmware >= V2J24 (2015). If your V2 is older or a clone that refuses
# dapdirect, swap the transport line for `transport select hla_swd`.

source [find interface/stlink.cfg]
transport select dapdirect_swd

set WORKAREASIZE 0x3000
set CHIPNAME STM32H723ZG
set BOARDNAME WASP-NODE

source [find target/stm32h7x.cfg]

# connect_assert_srst lets us program even when the core is asleep or stuck in
# a tight loop. It needs NRST wired through to the probe — J6.3 carries it, so
# this works with a TC2030-CTX cable. With a 4-wire SWD pigtail that omits
# NRST, use `reset_config none separate` instead or openocd will not attach.
reset_config srst_only srst_nogate connect_assert_srst

$_CHIPNAME.cpu0 configure -event gdb-attach {
	echo "Debugger attaching: halting execution"
	gdb_breakpoint_override hard
}

$_CHIPNAME.cpu0 configure -event gdb-detach {
	echo "Debugger detaching: resuming execution"
	resume
}

# connect_assert_srst means gdb needs a reset halt right after openocd init.
rename init old_init
proc init {} {
	old_init
	reset halt
}
