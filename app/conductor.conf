# Conductor-only build: no worker role, no WAMR — this node's RAM goes
# to the framebuffer and the peer connections instead, and its job is
# to discover workers and conduct the Mandelbrot render (see
# src/peer/conductor.c). Build with:
#   west build -b nucleo_f439zi app -d build/conductor -- -DEXTRA_CONF_FILE=conductor.conf
CONFIG_WASP_WORKER=n
CONFIG_WAMR=n
CONFIG_WASP_CONDUCTOR=y

# Room for one UDP discovery socket + up to 8 outbound TCP connections
# (the worker build only ever holds 4 fds; defaults are sized for it).
CONFIG_ZVFS_OPEN_MAX=12
CONFIG_NET_MAX_CONN=12
CONFIG_NET_MAX_CONTEXTS=12
# Zephyr's default ARP table holds TWO entries — with five workers on
# the subnet it thrashes, TX responses stall behind re-resolution, and
# all but ~2 connections starve into RPC timeouts (observed).
CONFIG_NET_ARP_TABLE_SIZE=16

# Five workers stream 524 B tile writes concurrently. With the default
# pools the RX path collapses: in-order data parked in socket receive
# queues between conductor polls eats the pool, inbound ACKs start
# dropping, and every stream degenerates into retransmission backoff
# (observed: total stall until a connection died and freed its share).
# Big RX pool + a per-connection window cap so N conns cannot
# overcommit it: 8 x 1536 B windows = 12 KiB < 16 KiB of RX bufs.
CONFIG_NET_PKT_RX_COUNT=64
CONFIG_NET_PKT_TX_COUNT=32
CONFIG_NET_BUF_RX_COUNT=128
CONFIG_NET_BUF_TX_COUNT=64
CONFIG_NET_TCP_MAX_RECV_WINDOW_SIZE=1536

# The render-loop progress logs come in bursts; don't drop them.
CONFIG_LOG_BUFFER_SIZE=8192
