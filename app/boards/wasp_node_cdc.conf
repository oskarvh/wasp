# Opt-in: move the console from USART3 (J9.3/J9.4) to the board's own USB-C.
#
#   west build -b wasp_node app -- \
#       -DEXTRA_CONF_FILE=boards/wasp_node_cdc.conf \
#       -DEXTRA_DTC_OVERLAY_FILE=boards/wasp_node_cdc.overlay
#
# The tradeoff: no USB-TTL dongle needed, but nothing prints until the host
# enumerates the device, so a hang in clock or driver init is invisible. That
# is why USART3 is the default while the board is still unproven.

CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_PRODUCT="wasp node"
CONFIG_USB_DEVICE_MANUFACTURER="wasp"
CONFIG_USB_CDC_ACM=y
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=y
CONFIG_UART_LINE_CTRL=y
