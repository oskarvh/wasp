# wasp node board, rev V1 — STM32H723ZGT6, 320 KB AXI SRAM + 128 KB DTCM,
# KSZ8794CNX switch on SPI3, quad PSRAM on OCTOSPI1 (not yet enabled).
# Per-board tuning only — keep anything board-agnostic in prj.conf.
#
# Deliberately almost empty for the first bring-up: the F439 and Pico configs
# were grown against observed failures, and guessing at tuning before the
# board has ever booted just produces failures that are hard to attribute.
#
# Known to be worth revisiting once it boots:
#   - WASP_WAMR_HEAP_POOL_SIZE: 88 KiB is sized for the F439's 192 KB SRAM.
#     This board has 320 KB of AXI SRAM, so the pool can grow a lot, which
#     means bigger or more concurrent WASM modules.
#   - NET_ARP_TABLE_SIZE: defaults to 2. Every node on this board is behind
#     its own 3-port switch, so a node talks to more peers than on the
#     F439 bench — the conductor work already showed table thrashing at
#     5 peers starving TCP into RPC timeouts. See conductor.conf.
