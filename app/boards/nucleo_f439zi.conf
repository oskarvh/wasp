# ST Nucleo-F439ZI (Cortex-M4F, 192K SRAM + 64K CCM, on-board LAN8742 PHY).
# Per-board tuning only — keep anything board-agnostic in prj.conf.

# One instance. A 64 KiB linear-memory page plus stacks and heap is most of
# this board's RAM, so the pool can only ever back one — and each unusable
# slot would still reserve an executor stack, taking RAM from the pool that
# the one real instance wants.
CONFIG_WASP_MAX_INSTANCES=1
